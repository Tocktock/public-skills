name: Diagnose public sync payload

on:
  push:
    branches:
      - tmp/publish-gpt-squad-sync
    paths:
      - ".github/workflows/diagnose-public-sync-payload.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/publish-gpt-squad-sync
      - name: Inspect payload
        shell: bash
        run: |
          set -euo pipefail
          cat .sync-payload/part-* > /tmp/source.b64
          echo "base64-bytes=$(wc -c < /tmp/source.b64)"
          sha256sum /tmp/source.b64
          base64 --decode /tmp/source.b64 > /tmp/source.bin
          echo "binary-bytes=$(wc -c < /tmp/source.bin)"
          sha256sum /tmp/source.bin
          file /tmp/source.bin
          if zstd -t /tmp/source.bin; then
            echo 'zstd=ok'
            tar --zstd -tf /tmp/source.bin | tee /tmp/files
            echo "entries=$(wc -l < /tmp/files)"
          else
            echo 'zstd=invalid'
            exit 1
          fi
